<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleng - Challenge Your Friends</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'fleng-pink': '#F64291',
            'fleng-blue': '#2FBDFD',
            'fleng-green': '#28C76F',
            'fleng-red': '#F24E4E',
            'fleng-bg': '#F7F7F8',
            'fleng-dark': '#1E1E1E',
            'fleng-muted': '#777777',
          },
          fontFamily: {
            sans: ['Baloo 2', 'cursive'],
          },
          borderRadius: {
            '4xl': '2rem', // 32px
          },
          boxShadow: {
            'cartoon': '5px 5px 0px #1E1E1E',
            'cartoon-hover': '8px 8px 0px #1E1E1E',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Baloo 2', cursive;
      cursor: none;
    }
    a, button, [role="button"] {
        cursor: none !important;
    }
    .animate-pop-in { animation: pop-in 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    
    @keyframes pop-in {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      80% { transform: scale(0.95); }
      100% { transform: scale(1); opacity: 1; }
    }

    .animated-shape {
      position: absolute;
      will-change: transform;
      animation: float 8s ease-in-out infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-25px) rotate(5deg);
      }
      100% {
        transform: translateY(0px) rotate(0deg);
      }
    }
    
    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes fill-text {
      0% { width: 0%; }
      40% { width: 100%; }
      100% { width: 100%; }
    }

    @keyframes leaderboard-climb {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-125%); }
    }

    @keyframes button-press {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.95); }
    }

    @keyframes checkmark-draw {
      0% {
        stroke-dashoffset: 25;
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    /* Custom cursor styles */
    .custom-cursor {
      position: fixed;
      width: 28px;
      height: 28px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.3s ease, height 0.3s ease, opacity 0.2s ease;
    }

    .cursor-ring {
      width: 100%;
      height: 100%;
      border: 3px solid #1E1E1E;
      border-radius: 50%;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .cursor-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background-color: #1E1E1E;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    .custom-cursor.is-hovering {
      width: 48px;
      height: 48px;
    }

    .custom-cursor.is-hovering .cursor-ring {
      transform: scale(0.75);
      border-color: #F64291;
    }

    .custom-cursor.is-hovering .cursor-dot {
      background-color: #F64291;
      transform: translate(-50%, -50%) scale(1.5);
    }
    
  </style>
</head>
<body class="text-fleng-dark">
  <div id="root"></div>
  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
      "react/": "https://aistudiocdn.com/react@^19.2.0/"
    }
  }
  </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
