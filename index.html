<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flengg - Challenge Your Friends</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-32x32.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#F64291">
  <meta name="msapplication-TileColor" content="#F64291">
  <style>
    /* Favicon styling */
    link[rel="icon"] {
      border-radius: 8px;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'Flengg-pink': '#F64291',
            'Flengg-blue': '#2FBDFD',
            'Flengg-green': '#28C76F',
            'Flengg-red': '#F24E4E',
            'Flengg-bg': '#F7F7F8',
            'Flengg-dark': '#1E1E1E',
            'Flengg-muted': '#777777',
          },
          fontFamily: {
            sans: ['Baloo 2', 'cursive'],
          },
          borderRadius: {
            '4xl': '2rem', // 32px
          },
          boxShadow: {
            'cartoon': '5px 5px 0px #1E1E1E',
            'cartoon-hover': '8px 8px 0px #1E1E1E',
          }
        }
      }
    }
  </script>
  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Baloo 2', cursive;
      cursor: none;
    }
    a, button, [role="button"] {
        cursor: none !important;
    }
    .animate-pop-in { animation: pop-in 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    
    @keyframes pop-in {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      80% { transform: scale(0.95); }
      100% { transform: scale(1); opacity: 1; }
    }

    .animated-shape {
      position: absolute;
      will-change: transform;
      animation: float 8s ease-in-out infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-25px) rotate(5deg);
      }
      100% {
        transform: translateY(0px) rotate(0deg);
      }
    }
    
    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes fill-text {
      0% { width: 0%; }
      40% { width: 100%; }
      100% { width: 100%; }
    }

    @keyframes leaderboard-climb {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-125%); }
    }

    @keyframes button-press {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.95); }
    }

    @keyframes checkmark-draw {
      0% {
        stroke-dashoffset: 25;
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    /* Custom cursor styles */
    .custom-cursor {
      position: fixed;
      width: 28px;
      height: 28px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.3s ease, height 0.3s ease, opacity 0.2s ease;
    }

    .cursor-ring {
      width: 100%;
      height: 100%;
      border: 3px solid #1E1E1E;
      border-radius: 50%;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .cursor-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background-color: #1E1E1E;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    .custom-cursor.is-hovering {
      width: 48px;
      height: 48px;
    }

    .custom-cursor.is-hovering .cursor-ring {
      transform: scale(0.75);
      border-color: #F64291;
    }

    .custom-cursor.is-hovering .cursor-dot {
      background-color: #F64291;
      transform: translate(-50%, -50%) scale(1.5);
    }

    /* Hide scrollbar for horizontal scroll */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Mobile Responsive Styles */
    @media (max-width: 640px) {
      /* Reduce heading sizes on mobile */
      h1 {
        font-size: 2.5rem !important;
        line-height: 1.2;
      }

      h2 {
        font-size: 2rem !important;
        line-height: 1.2;
      }

      /* Adjust padding and margins */
      section {
        padding-left: 1rem;
        padding-right: 1rem;
      }

      /* Make buttons more touch-friendly */
      button, a[role="button"] {
        min-height: 48px;
        padding: 0.75rem 1.5rem;
      }

      /* Reduce shadow effects for better mobile performance */
      .shadow-cartoon {
        box-shadow: 3px 3px 0px #1E1E1E;
      }

      .shadow-cartoon-hover:hover {
        box-shadow: 5px 5px 0px #1E1E1E;
      }

      /* Hide or simplify animated shapes on mobile */
      .animated-shape {
        display: none;
      }

      /* Adjust profile circle size */
      .w-24.h-24 {
        width: 6rem;
        height: 6rem;
      }

      /* Stack footer content better on mobile */
      footer .flex-wrap {
        gap: 1rem !important;
      }

      /* Adjust text sizes */
      .text-4xl {
        font-size: 1.875rem;
      }

      .text-5xl {
        font-size: 2.25rem;
      }

      /* Better spacing for mobile */
      .py-20 {
        padding-top: 3rem;
        padding-bottom: 3rem;
      }
    }

    @media (max-width: 768px) {
      /* Tablet adjustments */
      .md\:text-5xl {
        font-size: 2.5rem;
      }

      .md\:p-8 {
        padding: 1.5rem;
      }
    }

  </style>
</head>
<body class="text-Flengg-dark">
  <div id="root"></div>
  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
      "react/": "https://aistudiocdn.com/react@^19.2.0/"
    }
  }
  </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
